name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Unit tests and Debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 25
        # Matches gradle/gradle-daemon-jvm.properties (toolchainVersion=25).
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK API 37
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'

      - name: Set up Gradle cache and validate Wrapper
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check repository Wrapper version
        run: |
          grep -Fx 'distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.2-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -Eq '^distributionSha256Sum=[0-9a-f]{64}$' gradle/wrapper/gradle-wrapper.properties

      - name: Generate temporary fictional Firebase configuration
        run: |
          git check-ignore -v app/google-services.json
          test -z "$(git ls-files -- app/google-services.json)"
          test ! -e app/google-services.json
          # Build-only placeholders: no real Firebase project or usable API key.
          # No emulator, instrumentation test or application is started by this job.
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "demo-safehome-ci"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.safehome"
                  }
                },
                "api_key": [
                  {
                    "current_key": "CI_ONLY_NOT_A_REAL_API_KEY"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          git check-ignore -v app/google-services.json
          test -z "$(git status --porcelain -- app/google-services.json)"

      - name: Run unit tests and assemble Debug
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload JUnit XML results
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: junit-debug-results
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary Firebase configuration
        if: ${{ always() }}
        run: rm -f app/google-services.json
